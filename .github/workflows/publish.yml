name: Publicar imagen

# Cada semana se reconstruye sobre la última php:8.4-fpm-alpine, para que los
# parches de seguridad de PHP y Alpine lleguen solos a los proyectos.
on:
    push:
        branches: [main]
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ['8.4']
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Etiquetas
              id: tags
              run: |
                  image=ghcr.io/${GITHUB_REPOSITORY,,}
                  echo "tags=$image:${{ matrix.php }},$image:${{ matrix.php }}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  build-args: PHP_VERSION=${{ matrix.php }}
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.tags.outputs.tags }}
                  labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
